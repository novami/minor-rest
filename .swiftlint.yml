included:
  - App
  - Packages/MinorRESTCore/Sources
  - Packages/MinorRESTCore/Tests
excluded:
  - "**/.build"
disabled_rules:
  - trailing_comma
  - identifier_name
  - type_name
  - todo
  - nesting
  - optional_data_string_conversion
  - statement_position
  - switch_case_alignment
opt_in_rules:
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - sorted_first_last
  - redundant_nil_coalescing
line_length:
  warning: 200
  error: 300
  ignores_comments: true
  ignores_urls: true
file_length:
  warning: 700
  error: 1200
function_body_length:
  warning: 100
  error: 200
type_body_length:
  warning: 500
  error: 900
cyclomatic_complexity:
  warning: 35
  error: 60
large_tuple:
  warning: 4
  error: 6
