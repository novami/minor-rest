name: MinorREST
options:
  bundleIdPrefix: com.github.novami
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MinorRESTCore:
    path: Packages/MinorRESTCore
targets:
  MinorREST:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/appicon.svg
          - Resources/appicon.png
    dependencies:
      - package: MinorRESTCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MinorREST
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: MinorREST sends HTTP requests to servers on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.novami.minorrest
        PRODUCT_NAME: MinorREST
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  MinorREST:
    build:
      targets:
        MinorREST: all
    run:
      config: Debug
