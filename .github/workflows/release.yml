name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write   # vytvoření GitHub Release

jobs:
  release:
    runs-on: macos-26   # Apple Silicon (arm64)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: brew install xcodegen
      - run: make test
      - name: Sestavit a podepsat
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: scripts/release.sh "$GITHUB_REF_NAME"
      - name: Vytvořit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*.zip dist/*.zip.sig dist/*.dmg
