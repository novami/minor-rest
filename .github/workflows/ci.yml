name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go vet + test
        run: |
          if [ -d internal ]; then go vet ./internal/... && go test ./internal/...; fi
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build
