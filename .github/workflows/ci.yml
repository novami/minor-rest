name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            .build
            Packages/MinorRESTCore/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('Packages/MinorRESTCore/Package.swift', 'Packages/MinorRESTCore/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-
      - name: Test core
        run: make test
      - name: Build app
        run: make build
